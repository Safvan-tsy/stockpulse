[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stockpulse"
version = "0.1.0"
description = "AI-Powered Indian Stock Intelligence on Notion"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "notion-client>=2.2.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "click>=8.1.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]

[project.scripts]
stockpulse = "stockpulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
